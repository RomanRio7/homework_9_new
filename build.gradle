plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'cinescope'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.assertj:assertj-core:3.26.0'
    implementation 'io.rest-assured:rest-assured:5.4.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    implementation 'org.jdbi:jdbi3-core:3.45.1'
    implementation 'org.jdbi:jdbi3-sqlobject:3.45.1'
    implementation 'org.jdbi:jdbi3-jackson2:3.45.1'
    implementation 'org.jdbi:jdbi3-postgres:3.45.1'
    implementation 'org.postgresql:postgresql:42.7.4'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    // Allure
    testImplementation 'io.qameta.allure:allure-junit5:2.29.0'
    implementation 'io.qameta.allure:allure-java-commons:2.29.0'
}

test {
    useJUnitPlatform()
    systemProperty "allure.results.directory", "$buildDir/allure-results"
}

allure {
    version = '2.29.0'
    autoconfigure = true

    aspectjweaver = false

    useJUnit5 {
        version = '2.29.0'
    }
}