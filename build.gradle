plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'com.github.<your_github_username>'
version = '1.0.0'

dependencies {
    // То, что нужно потребителям (UI-проекту) — делаем api
    api 'org.assertj:assertj-core:3.26.0'
    api 'io.rest-assured:rest-assured:5.4.0'

    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    api 'org.jdbi:jdbi3-core:3.45.1'
    api 'org.jdbi:jdbi3-sqlobject:3.45.1'
    api 'org.jdbi:jdbi3-jackson2:3.45.1'
    api 'org.jdbi:jdbi3-postgres:3.45.1'
    api 'org.postgresql:postgresql:42.7.4'

    // Allure steps аннотации/Allure.step — если используешь в степах, оставляем api/implementation
    api 'io.qameta.allure:allure-java-commons:2.29.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'io.qameta.allure:allure-junit5:2.29.0'
    testImplementation 'com.github.RomanRio7:homework_9_new:v1.0.0'
    testImplementation 'com.codeborne:selenide:6.19.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    implementation 'com.auth0:java-jwt:4.4.0'
}

test {
    useJUnitPlatform()
    systemProperty "allure.results.directory", "$buildDir/allure-results"
}

allure {
    version = '2.29.0'
    autoconfigure = true
    aspectjweaver = false
    useJUnit5 {
        version = '2.29.0'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
